name: Generate Developer Arcade

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Galaga Contribution Game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Sanjithsece
          games: "galaga"

      - name: Deploy Arcade
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
